                        .filter(w => w.id !== word.id)

                        .slice(0, 3)
                        .map(w => w.uzbek);
                    const options = [...wrongOptions, word.uzbek].sort(() => 0.5 - Math.random());
                    return { word: word.hanzi, pinyin: word.pinyin, correct: word.uzbek, options };
                });

                setQuestions(generateQuestions());

            if (questions.length === 0) return <div>Yuklanmoqda...</div>;

                                    let btnClass = "border-2 border-gray-200 text-gray-700 hover:border-purple-500 hover:bg-purple-50 rounded-lg p-4 font-semibold text-xl transition-all duration-200";
                                    if (selected !== null) {
                                        if (i === current.ans) btnClass = "border-2 border-green-500 bg-green-500 text-white rounded-lg p-4 font-semibold text-xl";
                                        else if (i === selected && i !== current.ans) btnClass = "border-2 border-red-500 bg-red-500 text-white rounded-lg p-4 font-semibold text-xl";
                                        else btnClass = "border-2 border-gray-200 text-gray-400 bg-gray-50 rounded-lg p-4 font-semibold text-xl opacity-50";
                                    }
                                    return (
                                        <button 
                                            key={i} 
                                            disabled={selected !== null}
                                            onClick={() => handleSelect(i)}
                                            className={btnClass}
                                        >
                                            {opt}
                                        </button>
                                    )
                                })}
                            </div>
                        </div>
                        <div className="bg-gray-50 p-2">
                            <div className="w-full bg-gray-200 rounded-full h-1.5">
                                <div className="bg-purple-500 h-1.5 rounded-full transition-all duration-300" style={{ width: `${((qIndex)/15)*100}%` }}></div>
                            </div>
                        </div>
                    </div>
                </div>
            )
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('vocab');

            const renderContent = () => {
                switch(activeTab) {
                    case 'vocab': return <VocabSection />;
                    case 'vocab-test': return <VocabTestSection />;
                    case 'dialogues': return <DialoguesSection />;
                    case 'grammar': return <GrammarSection />;
                    case 'grammar-test': return <GrammarTestSection />;
                    default: return <VocabSection />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-green-700 text-white pt-10 pb-6 px-4 shadow-md sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto text-center">
                            <h1 className="text-2xl md:text-4xl font-extrabold mb-2 tracking-tight">Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz</h1>
                            <p className="text-green-200 font-semibold text-lg md:text-xl">HSK 4 - 15-dars: 教育孩子的艺术 (Bola tarbiyalash san'ati)</p>
                        </div>
                    </header>

                    {/* Navigation */}
                    <div className="bg-white border-b border-gray-200 shadow-sm sticky top-[110px] md:top-[124px] z-40 overflow-x-auto">
                        <div className="max-w-6xl mx-auto flex">
                            <button onClick={() => setActiveTab('vocab')} className={`flex items-center whitespace-nowrap px-6 py-4 font-bold border-b-4 transition-colors ${activeTab === 'vocab' ? 'border-green-600 text-green-700 bg-green-50' : 'border-transparent text-gray-500 hover:text-green-600 hover:bg-gray-50'}`}>
                                <SvgIcon type="book" /> Lug'at (Flashcards)
                            </button>
                            <button onClick={() => setActiveTab('vocab-test')} className={`flex items-center whitespace-nowrap px-6 py-4 font-bold border-b-4 transition-colors ${activeTab === 'vocab-test' ? 'border-green-600 text-green-700 bg-green-50' : 'border-transparent text-gray-500 hover:text-green-600 hover:bg-gray-50'}`}>
                                <SvgIcon type="pencil" /> Lug'at Testi
                            </button>
                            <button onClick={() => setActiveTab('dialogues')} className={`flex items-center whitespace-nowrap px-6 py-4 font-bold border-b-4 transition-colors ${activeTab === 'dialogues' ? 'border-green-600 text-green-700 bg-green-50' : 'border-transparent text-gray-500 hover:text-green-600 hover:bg-gray-50'}`}>
                                <SvgIcon type="chat" /> Matnlar & Dialoglar
                            </button>
                            <button onClick={() => setActiveTab('grammar')} className={`flex items-center whitespace-nowrap px-6 py-4 font-bold border-b-4 transition-colors ${activeTab === 'grammar' ? 'border-blue-600 text-blue-700 bg-blue-50' : 'border-transparent text-gray-500 hover:text-blue-600 hover:bg-gray-50'}`}>
                                <SvgIcon type="lightbulb" /> Grammatika
                            </button>
                            <button onClick={() => setActiveTab('grammar-test')} className={`flex items-center whitespace-nowrap px-6 py-4 font-bold border-b-4 transition-colors ${activeTab === 'grammar-test' ? 'border-purple-600 text-purple-700 bg-purple-50' : 'border-transparent text-gray-500 hover:text-purple-600 hover:bg-gray-50'}`}>
                                <SvgIcon type="check" /> Grammatika Testi (15 savol)
                            </button>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-grow w-full max-w-6xl mx-auto p-4 md:p-6 mb-12">
                        {renderContent()}
                    </main>

                    {/* Footer */}
                    <footer className="bg-gray-800 text-gray-300 py-8 text-center mt-auto border-t-4 border-green-600">
                        <p className="font-semibold mb-2 text-lg">HSK 4 Standard Course - Lesson 15</p>
                        <p className="text-sm">© 2026 Dilfuza Kāng lǎo shī (telegram@diffila) | Barcha huquqlar himoyalangan.</p>
                        
                        <div className="mt-4 flex justify-center space-x-2">
                            <span className="w-2 h-2 rounded-full bg-red-500"></span>
                            <span className="w-2 h-2 rounded-full bg-yellow-500"></span>
                            <span className="w-2 h-2 rounded-full bg-green-500"></span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
